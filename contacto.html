<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Timbó — Contacto. Escribinos para consultas sobre proyectos de arquitectura bioclimática.">
  <title>Timbó — Contacto</title>
  <link rel="icon" type="image/png" href="assets/images/logo/solo-arbol/Timbo_Isologo1_Gris1.png">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="page--contact-image">
  <nav class="main-nav main-nav--light is-visible" aria-label="Main navigation">
    <ul class="nav__links">
      <li><a href="index.html" class="nav__link">Inicio</a></li>
      <li><a href="proyectos.html" class="nav__link">Proyectos</a></li>
      <li><a href="sustentabilidad.html" class="nav__link">Sustentabilidad</a></li>
      <li><a href="servicios.html" class="nav__link">Servicios</a></li>
      <li><a href="sobre-nosotros.html" class="nav__link">Sobre nosotros</a></li>
      <li><a href="contacto.html" class="nav__link nav__link--active">Contacto</a></li>
    </ul>

    <!-- Floating logo y botón hamburguesa SÓLO mobile (ocultos en desktop por CSS).
         Aparecen al scrollear más de 600px. -->
    <div class="nav-floating-mobile">
      <a href="index.html" class="floating-logo-mobile" aria-label="Ir al inicio">
        <img src="assets/images/logo/timbo-negro.svg" alt="Timbó">
      </a>
      <button type="button" class="nav-toggle-mobile" aria-label="Abrir menú" aria-expanded="false">
        <span class="nav-toggle-mobile__bar"></span>
        <span class="nav-toggle-mobile__bar"></span>
        <span class="nav-toggle-mobile__bar"></span>
      </button>
    </div>
  </nav>

  <main class="page-content">
    <section class="contact-image" data-nav-theme="light">
      <div class="contact-image__media">
        <img src="assets/images/contact/contact-hero.jpg" alt="Paisaje de contacto de Timbó" loading="eager" decoding="async">
      </div>

      <div class="contact-image__content">
        <div class="contact-image__intro anim-fade-up" data-anim-delay="80">
          <h1 class="contact-image__title">Contacto</h1>
        </div>

        <ul class="contact-image__list" aria-label="Datos de contacto">
          <li class="contact-image__item anim-fade-up" data-anim-delay="160">
            <img class="contact-image__icon" src="assets/images/contact/icono-mail.svg" alt="" aria-hidden="true" loading="lazy" decoding="async">
            <a class="contact-image__link" href="mailto:estudiotimboinfo@gmail.com">estudiotimboinfo@gmail.com</a>
          </li>
          <li class="contact-image__item anim-fade-up" data-anim-delay="240">
            <img class="contact-image__icon" src="assets/images/contact/icono-telefono.svg" alt="" aria-hidden="true" loading="lazy" decoding="async">
            <div class="contact-image__phones">
              <div class="contact-image__phone-option" data-contact-phone>
                <button
                  class="contact-image__phone-trigger"
                  type="button"
                  data-contact-phone-trigger
                  aria-expanded="false"
                  aria-controls="contact-phone-actions-mia"
                  aria-haspopup="menu"
                >
                  +54 9 11 40252792 (Mia)
                </button>
                <div
                  class="contact-image__phone-actions"
                  id="contact-phone-actions-mia"
                  data-contact-phone-actions
                  aria-label="Elegir cómo contactar a Mia"
                  role="menu"
                  hidden
                >
                  <a class="contact-image__phone-action" href="tel:+5491140252792" role="menuitem">Llamar</a>
                  <a class="contact-image__phone-action" href="https://wa.me/5491140252792" target="_blank" rel="noreferrer" role="menuitem">WhatsApp</a>
                </div>
              </div>
              <span class="contact-image__separator" aria-hidden="true">/</span>
              <div class="contact-image__phone-option" data-contact-phone>
                <button
                  class="contact-image__phone-trigger"
                  type="button"
                  data-contact-phone-trigger
                  aria-expanded="false"
                  aria-controls="contact-phone-actions-gero"
                  aria-haspopup="menu"
                >
                  +54 9 11 40252792 (Gero)
                </button>
                <div
                  class="contact-image__phone-actions"
                  id="contact-phone-actions-gero"
                  data-contact-phone-actions
                  aria-label="Elegir cómo contactar a Gero"
                  role="menu"
                  hidden
                >
                  <a class="contact-image__phone-action" href="tel:+5491140252792" role="menuitem">Llamar</a>
                  <a class="contact-image__phone-action" href="https://wa.me/5491140252792" target="_blank" rel="noreferrer" role="menuitem">WhatsApp</a>
                </div>
              </div>
            </div>
          </li>
          <li class="contact-image__item anim-fade-up" data-anim-delay="320">
            <img class="contact-image__icon" src="assets/images/contact/icono-instagram.svg" alt="" aria-hidden="true" loading="lazy" decoding="async">
            <a class="contact-image__link" href="https://www.instagram.com/estudio.timbo/" target="_blank" rel="noreferrer">estudio.timbo</a>
          </li>
        </ul>
      </div>

    </section>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
