[build]
  publish = "."
  functions = "netlify/functions"

# ============================================================
# Cache headers
# ============================================================

# Imágenes, fuentes, CSS, JS — cachear 1 año
# (Netlify invalida automáticamente en cada deploy por content hash)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Páginas HTML — sin cache (siempre fresh)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/proyectos/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
