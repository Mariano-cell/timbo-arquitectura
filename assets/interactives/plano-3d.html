function box(w, h, d, mat, x, y, z, castShadow = true) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x + w/2, y + h/2, z + d/2);
  mesh.castShadow = castShadow;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function door(x, y, z, rotY) {
  const grp = new THREE.Group();
  const frameGeo = new THREE.BoxGeometry(DOOR_W + 0.1, DOOR_H + 0.1, 0.05);
  const frame = new THREE.Mesh(frameGeo, matFrame);

  const leafGeo = new THREE.BoxGeometry(DOOR_W, DOOR_H, DOOR_D);
  const leaf = new THREE.Mesh(leafGeo, matDoor);
  leaf.position.set(DOOR_W * 0.3, 0, DOOR_W * 0.3);
  leaf.rotation.y = -Math.PI / 5;
  grp.add(leaf);
  grp.position.set(x, y + DOOR_H / 2, z);
  grp.rotation.y = rotY;
  scene.add(grp);
}

const arrowColor  = new THREE.Color(0x1a3d4a);

const arrowGroups = [];

const shaftGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.6, 6);
shaftGeo.rotateX(Math.PI / 2);
shaftGeo.translate(0, 0, 0.3);
const coneGeo = new THREE.ConeGeometry(0.2, 0.35, 8);
coneGeo.rotateX(Math.PI / 2);
coneGeo.translate(0, 0, 0.75);

function makeFlowArrow(path, speed = 0.004) {
  const group = new THREE.Group();
  const shaft = new THREE.Mesh(shaftGeo, arrowMat.clone());
  shaft.userData.isWind = true;
  const cone  = new THREE.Mesh(coneGeo, arrowMat.clone());
  cone.userData.isWind = true;
  group.add(shaft);
  group.add(cone);
  group.visible = false;
  scene.add(group);
  arrowGroups.push({ arrow: group, shaft, cone, path, t: Math.random(), speed });
}

function pathPoint(path, t) {
  const total = path.length - 1;
  const scaled = t * total;
  const idx = Math.min(Math.floor(scaled), total - 1);
  const f = scaled - idx;
  const pos = path[idx].clone().lerp(path[idx + 1], f);
  const dir = path[idx + 1].clone().sub(path[idx]).normalize();
  return { pos, dir };
}

function updateWind() {
  arrowGroups.forEach(({ arrow, shaft, cone, path, speed }, i) => {
    arrowGroups[i].t = (arrowGroups[i].t + speed) % 1;
    const { pos, dir } = pathPoint(path, arrowGroups[i].t);
    arrow.position.copy(pos);
    const target = pos.clone().add(dir);
    arrow.lookAt(target);
    const fade = Math.sin(arrowGroups[i].t * Math.PI);
    shaft.material.opacity = fade * 0.85;
    cone.material.opacity  = fade * 0.85;
  });
}


let isDragging = false, isRight = false;
let prevX = 0, prevY = 0;
let downX = 0, downY = 0;
let theta = Math.PI / 4, phi = Math.PI / 2.4, radius = 32;
let targetX = 7, targetZ = 5.5;
let camTargetTheta = theta, camTargetPhi = phi, camTargetRadius = radius;

let camTargetX = targetX, camTargetZ = targetZ;

renderer.domElement.addEventListener('mousedown', e => {
  isDragging = true;
  isRight = e.button === 2;
  prevX = e.clientX; prevY = e.clientY;
  downX = e.clientX; downY = e.clientY;
});
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - prevX, dy = e.clientY - prevY;
  prevX = e.clientX; prevY = e.clientY;
  if (isRight) {
    camTargetX -= dx * 0.04;
    camTargetZ -= dy * 0.04;
  } else {
    camTargetTheta -= dx * 0.008;
    camTargetPhi = Math.max(0.15, Math.min(Math.PI/2.1, camTargetPhi - dy * 0.006));
  }
});
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const roomLabelEl = document.getElementById('room-label');

renderer.domElement.addEventListener('click', e => {
  if (Math.abs(e.clientX - downX) > 4 || Math.abs(e.clientY - downY) > 4) return;
  mouse.x =  (e.clientX / W) * 2 - 1;
  mouse.y = -(e.clientY / H) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(floorMeshes);
  if (hits.length) {
    const id = hits[0].object.userData.roomId;
    roomLabelEl.textContent = hits[0].object.userData.label;
    roomLabelEl.style.opacity = '1';
    setTimeout(() => roomLabelEl.style.opacity = '0', 2200);
    focusRoom(id);
  }
});

function focusRoom(id) {
  const f = floors.find(r => r.id === id);
  if (!f) return;
  camTargetX = f.x + f.w / 2;
  camTargetZ = f.z + f.d / 2;
  camTargetRadius = 14;
  camTargetPhi = 0.9;
}

let sunActive = false;
let sunTime   = 0.18;
const SUN_SPEEDS = { '1x': 0.00018, '2x': 0.00036, '5x': 0.0009, '10x': 0.0018 };
let SUN_SPEED = SUN_SPEEDS['1x'];

// Controlado via postMessage desde la página padre
window.addEventListener('message', (e) => {
  const { action, value } = e.data || {};
  if (action === 'toggleWind') {
    windActive = !windActive;
    arrowGroups.forEach(({ arrow }) => { arrow.visible = windActive; });
  } else if (action === 'toggleWire') {
    wireActive = !wireActive;
    edgeObjects.forEach(({ lines, mesh }) => {
      lines.visible = wireActive;
      mesh.visible = !wireActive;
    });
    if (wireActive && sunActive) {
      sunActive = false;
      sunMesh.visible = false;
      glow.visible = false;
      window.parent.postMessage({ action: 'sunDeactivated' }, '*');
    }
  } else if (action === 'toggleRotate') {
    autoRotate = !autoRotate;
  } else if (action === 'toggleSun') {
    sunActive = !sunActive;
  } else if (action === 'setSpeed') {
    SUN_SPEED = SUN_SPEEDS[value] || SUN_SPEEDS['1x'];
  }
});

function skyAt(t) {
  const stops = [
    { t:0.00, sky:[0x0a,0x0a,0x12], sun:[0x11,0x11,0x33], amb:0.10, int:0.00 },
    { t:0.17, sky:[0x0a,0x0a,0x12], sun:[0x11,0x11,0x33], amb:0.10, int:0.00 },
    { t:0.22, sky:[0x1a,0x08,0x20], sun:[0xff,0x60,0x20], amb:0.25, int:0.40 },
    { t:0.28, sky:[0xff,0x99,0x44], sun:[0xff,0xcc,0x66], amb:0.50, int:0.90 },
    { t:0.42, sky:[0x55,0x99,0xdd], sun:[0xff,0xf5,0xcc], amb:0.65, int:1.40 },
    { t:0.50, sky:[0x33,0x88,0xff], sun:[0xff,0xff,0xee], amb:0.70, int:1.60 },
    { t:0.62, sky:[0x55,0x99,0xdd], sun:[0xff,0xf0,0xcc], amb:0.60, int:1.30 },
    { t:0.75, sky:[0xff,0x77,0x22], sun:[0xff,0x99,0x44], amb:0.45, int:0.80 },
    { t:0.80, sky:[0x22,0x05,0x18], sun:[0x44,0x11,0x44], amb:0.18, int:0.10 },
    { t:0.85, sky:[0x0a,0x0a,0x12], sun:[0x11,0x11,0x33], amb:0.10, int:0.00 },
    { t:1.00, sky:[0x0a,0x0a,0x12], sun:[0x11,0x11,0x33], amb:0.10, int:0.00 },
  ];

  let a = stops[0], b = stops[stops.length-1];
  for (let i = 0; i < stops.length-1; i++) {
    if (t >= stops[i].t && t <= stops[i+1].t) { a = stops[i]; b = stops[i+1]; break; }
  }
  const f = a.t === b.t ? 0 : (t - a.t) / (b.t - a.t);
  const lerp = (x,y) => x + (y-x)*f;
  const lerpC = (x,y,i) => Math.round(lerp(x[i],y[i]));

  return {
    sky: new THREE.Color(
      lerpC(a.sky,b.sky,0)/255,
      lerpC(a.sky,b.sky,1)/255,
      lerpC(a.sky,b.sky,2)/255
    ),
    sunColor: new THREE.Color(
      lerpC(a.sun,b.sun,0)/255,
      lerpC(a.sun,b.sun,1)/255,
      lerpC(a.sun,b.sun,2)/255
    ),
    amb:  lerp(a.amb, b.amb),
    int:  lerp(a.int, b.int),
  };
}

// Centro de la casa
const HOUSE_CX = 7, HOUSE_CZ = 5.5;
// Radio de la órbita del sol y elevación máxima
const SUN_RADIUS = 14;
const SUN_MAX_Y  = 16;

function updateSun(t) {
  // t: 0..1 = medianoche..medianoche
  // El sol es visible entre t ≈ 0.25 (amanecer, 6h) y t ≈ 0.75 (ocaso, 18h)
  // Mapeamos ese rango a un arco de 0° a 180°

  // Ángulo del arco: 0 = este (amanecer), PI = oeste (ocaso)
  const dayProgress = (t - 0.25) / 0.5; // 0 al amanecer, 1 al ocaso
  const arcAngle = dayProgress * Math.PI;

  // Posición: arco semicircular de este a oeste, pasando por el cénit
  // Este = +x, Oeste = -x, el arco va por el sur (z negativo respecto a la casa)
  const sx = HOUSE_CX + SUN_RADIUS * Math.cos(arcAngle);
  const sy = SUN_MAX_Y * Math.sin(arcAngle);
  const sz = HOUSE_CZ - 6 * Math.sin(arcAngle); // leve inclinación sur

  sun.position.set(sx, Math.max(sy, -5), sz);
  sunMesh.position.copy(sun.position);
  glow.position.copy(sun.position);

  const isAbove = sy > 0;
  sunMesh.visible = isAbove;
  glow.visible    = isAbove;

  // Color e intensidad según hora
  const data = skyAt(t);
  sun.color.copy(data.sunColor);
  sun.intensity = data.int;
  ambient.intensity = data.amb;

  if (isAbove) {
    sunMat.color.copy(data.sunColor);
    glowMat.color.copy(data.sunColor);
    // Más grande al mediodía, más chico en horizonte
    const s = 0.35 + Math.sin(arcAngle) * 0.5;
    sunMesh.scale.setScalar(s);
    glow.scale.set(s * 5, s * 5, 1);
  }
}

sunMesh.visible = false;
glow.visible    = false;
updateSun(0.5);


let wireActive = false;

const WIRE_COLOR = 0x000000;
const edgeObjects = [];

const houseMeshes = [];
scene.traverse(obj => {
  if (obj.isMesh && obj !== sunMesh && !obj.userData.isWind) houseMeshes.push(obj);
});

houseMeshes.forEach(mesh => {
  const edges = new THREE.EdgesGeometry(mesh.geometry, 10);
  const mat   = new THREE.LineBasicMaterial({
    color: WIRE_COLOR,
    linewidth: 2,
    transparent: true,
    opacity: 0.9,
    depthTest: true,
  });
  const lines = new THREE.LineSegments(edges, mat);
  lines.position.copy(mesh.position);
  lines.rotation.copy(mesh.rotation);
  lines.scale.copy(mesh.scale);
  lines.visible = wireActive;
  scene.add(lines);
  edgeObjects.push({ lines, mesh });
  mesh.visible = !wireActive;
});


gridMesh.visible = false;

let autoRotate = true;
const AUTO_ROT_SPEED = 0.0015;


function animate() {
  requestAnimationFrame(animate);

  if (sunActive) {
    sunTime = (sunTime + SUN_SPEED) % 1;
    updateSun(sunTime);
  }

  if (windActive) updateWind();

  if (autoRotate && !isDragging) camTargetTheta += AUTO_ROT_SPEED;

  theta  += (camTargetTheta  - theta)  * 0.08;
  phi    += (camTargetPhi    - phi)    * 0.08;
  radius += (camTargetRadius - radius) * 0.08;
  targetX += (camTargetX - targetX)   * 0.08;
  targetZ += (camTargetZ - targetZ)   * 0.08;

  camera.position.x = targetX + radius * Math.sin(phi) * Math.sin(theta);
  camera.position.y =           radius * Math.cos(phi);
  camera.position.z = targetZ + radius * Math.sin(phi) * Math.cos(theta);
  camera.lookAt(targetX, 0, targetZ);

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
</body>
</html>
